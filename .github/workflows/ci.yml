name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fantasy
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasy -d fantasy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://fantasy:fantasy@127.0.0.1:5432/fantasy
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w @fantasy/db
      - run: npm run db:smoke -w @fantasy/db
      - run: npm run bridge:smoke -w @fantasy/api
      - run: npm run espn:import:smoke -w @fantasy/api
      - run: npm run yahoo:smoke -w @fantasy/api
      - run: npm run invitation:smoke -w @fantasy/api
      - run: npm run registration:smoke -w @fantasy/api
      - run: npm run runtime:smoke

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_URL: http://localhost:3000
      APP_PORT: "3000"
      HTTPS_PORT: "3443"
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CREDENTIAL_ENCRYPTION_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REGISTRATION_INVITE_CODE: laces-out-ci-registration-code
    steps:
      - uses: actions/checkout@v4
      - run: docker build --check .
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 10 --retry-delay 2 http://localhost:3000/health/ready
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
